services:
  web:
    image: humming-vision-web
    ports:
      - "127.0.0.1:3000:3000"
    restart: always
    env_file:
      - .env.web

  api:
    image: humming-vision-api
    ports:
      - "127.0.0.1:4000:3000"
    restart: always
    env_file:
      - .env.api
    volumes:
      - ./global-bundle.pem:/app/dist/global-bundle.pem:ro
